name: Deploy to cPanel (SFTP)

on:
  workflow_dispatch:

concurrency:
  group: cpanel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check deployment secrets
        id: check
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER || secrets.FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME || secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_SERVER" ] || [ -z "$SFTP_USERNAME" ] || [ -z "$SFTP_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SFTP secrets are not configured; skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        if: steps.check.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via SFTP
        if: steps.check.outputs.configured == 'true'
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER || secrets.FTP_SERVER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME || secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD || secrets.FTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR || 'public_html' }}
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_SERVER" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"

          export LFTP_PASSWORD="$SFTP_PASSWORD"
          lftp --env-password -u "$SFTP_USERNAME" "sftp://$SFTP_SERVER:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            set net:timeout 20;
            set net:max-retries 3;
            pwd;
            rm -f \"$SFTP_REMOTE_DIR/index.html\";
            rm -f \"$SFTP_REMOTE_DIR/.htaccess\";
            rm -f \"$SFTP_REMOTE_DIR/404.html\";
            rm -f \"$SFTP_REMOTE_DIR/robots.txt\";
            rm -f \"$SFTP_REMOTE_DIR/sitemap.xml\";
            rm -f \"$SFTP_REMOTE_DIR/favicon.svg\";
            put -O \"$SFTP_REMOTE_DIR\" ./dist/index.html;
            put -O \"$SFTP_REMOTE_DIR\" ./dist/.htaccess;
            put -O \"$SFTP_REMOTE_DIR\" ./dist/404.html;
            put -O \"$SFTP_REMOTE_DIR\" ./dist/robots.txt;
            put -O \"$SFTP_REMOTE_DIR\" ./dist/sitemap.xml;
            put -O \"$SFTP_REMOTE_DIR\" ./dist/favicon.svg;
            mirror -R --verbose ./dist/ \"$SFTP_REMOTE_DIR\";
            bye
          "

      - name: Deployment skipped
        if: steps.check.outputs.configured != 'true'
        run: |
          echo "::notice::Add SFTP_SERVER, SFTP_USERNAME, and SFTP_PASSWORD repository secrets (SFTP_REMOTE_DIR is optional). See DEPLOYMENT.md."
