name: Diagnose cPanel SFTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Inspect remote directories
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER || secrets.FTP_SERVER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME || secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_SERVER" ] || [ -z "$SFTP_USERNAME" ] || [ -z "$SFTP_PASSWORD" ]; then
            echo "Missing SFTP secrets"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_SERVER" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"

          export LFTP_PASSWORD="$SFTP_PASSWORD"
          lftp --env-password -u "$SFTP_USERNAME" "sftp://$SFTP_SERVER:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            set net:timeout 20;
            set net:max-retries 2;
            pwd;
            ls -la;
            ls -la public_html;
            ls -la public_html/public_html;
            ls -la www;
            ls -la asset13.com;
            bye
          "
