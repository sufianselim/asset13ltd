<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Asset 13 LTD</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A1F33">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 78% 18%, rgba(201, 162, 39, 0.16), transparent 46%),
        #06121f;
      color: #fff;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 680px; }
    .eyebrow {
      margin: 0 0 1.5rem;
      color: #e6c766;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
    .code {
      margin: 0;
      color: rgba(201, 162, 39, 0.22);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(7rem, 22vw, 14rem);
      line-height: 0.8;
      letter-spacing: -0.04em;
    }
    h1 {
      margin: 0.5rem 0 1rem;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 500;
      line-height: 1.1;
    }
    p { color: rgba(255, 255, 255, 0.7); line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.9rem; margin-top: 2rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0.9rem 1.75rem;
      border: 1px solid transparent;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .gold { background: #c9a227; color: #06121f; }
    .outline { border-color: rgba(255, 255, 255, 0.35); color: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Page not found</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page has moved, or never existed.</h1>
    <p>The address you followed may be outdated or mistyped. Return to the homepage, or explore our projects.</p>
    <div class="actions">
      <a class="btn gold" href="/">Back to home</a>
      <a class="btn outline" href="/projects">View projects</a>
    </div>
  </main>
</body>
</html>
